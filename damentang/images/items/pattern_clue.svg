<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 泛黄纸片底色 -->
  <rect x="4" y="4" width="56" height="56" rx="1" fill="#1e180c" stroke="#8a7a60" stroke-width="1"/>
  <!-- 九宫格 -->
  <line x1="20" y1="14" x2="44" y2="14" stroke="#6a5a40" stroke-width="0.4"/>
  <line x1="20" y1="50" x2="44" y2="50" stroke="#6a5a40" stroke-width="0.4"/>
  <line x1="20" y1="14" x2="20" y2="50" stroke="#6a5a40" stroke-width="0.4"/>
  <line x1="44" y1="14" x2="44" y2="50" stroke="#6a5a40" stroke-width="0.4"/>
  <!-- 四角元素符号 -->
  <!-- 左上：水 💧 -->
  <path d="M24 22 Q26 18 28 22 Q26 24 24 22" fill="#4a8" opacity="0.9"/>
  <text x="26" y="20" text-anchor="middle" fill="#4a8" font-size="5">💧</text>
  <!-- 右上：火 🔥 -->
  <text x="38" y="20" text-anchor="middle" fill="#e55" font-size="5">🔥</text>
  <!-- 左下：风 💨 -->
  <text x="26" y="44" text-anchor="middle" fill="#aaa" font-size="5">💨</text>
  <!-- 右下：土 🪨 -->
  <text x="38" y="44" text-anchor="middle" fill="#b80" font-size="5">🪨</text>
  <!-- 中心：归一 ✧ -->
  <polygon points="32,29 34,31 32,33 30,31" fill="#c4a35a" opacity="0.8"/>
  <!-- 连线：水→火→风→土→归一 -->
  <line x1="28" y1="22" x2="36" y2="22" stroke="#c4a35a" stroke-width="0.8" stroke-dasharray="2,1"/>
  <line x1="36" y1="24" x2="28" y2="42" stroke="#c4a35a" stroke-width="0.8" stroke-dasharray="2,1"/>
  <line x1="28" y1="42" x2="36" y2="42" stroke="#c4a35a" stroke-width="0.8" stroke-dasharray="2,1"/>
  <line x1="34" y1="30" x2="36" y2="42" stroke="#c4a35a" stroke-width="0.5" stroke-dasharray="1,1"/>
  <line x1="30" y1="30" x2="28" y2="42" stroke="#c4a35a" stroke-width="0.5" stroke-dasharray="1,1"/>
  <!-- 祖父注解 -->
  <text x="10" y="58" fill="#8a7a5a" font-size="2.8" font-style="italic">水→火→风→土→归一</text>
</svg>
