<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 族谱页面底纹 -->
  <rect x="8" y="4" width="36" height="56" rx="1" fill="#1e180c" stroke="#8a7a5a" stroke-width="1.2"/>
  <!-- 右侧撕裂边缘 -->
  <path d="M44 4 L42 8 L44 12 L40 16 L43 20 L40 24 L43 28 L39 32 L42 36 L38 40 L42 44 L39 48 L42 52 L38 56 L42 60 L44 60 L44 4 Z" fill="#1e180c" stroke="#8a7a5a" stroke-width="1.2"/>
  <!-- 族谱竖线 -->
  <line x1="26" y1="14" x2="26" y2="52" stroke="#6a5a40" stroke-width="0.6"/>
  <!-- 世代记录行 -->
  <line x1="14" y1="18" x2="24" y2="18" stroke="#8a7a5a" stroke-width="0.5"/>
  <line x1="14" y1="24" x2="24" y2="24" stroke="#8a7a5a" stroke-width="0.5"/>
  <line x1="14" y1="30" x2="24" y2="30" stroke="#8a7a5a" stroke-width="0.5"/>
  <line x1="30" y1="18" x2="40" y2="18" stroke="#8a7a5a" stroke-width="0.5"/>
  <line x1="30" y1="24" x2="40" y2="24" stroke="#8a7a5a" stroke-width="0.5"/>
  <!-- 空白的方框（玩家名字旁） -->
  <rect x="30" y="28" width="10" height="6" fill="none" stroke="#8b2500" stroke-width="0.8"/>
  <!-- 母亲字迹（潦草细线） -->
  <text x="18" y="40" text-anchor="middle" fill="#8a7a5a" font-size="3.5" font-style="italic">我的孩子不</text>
  <text x="18" y="46" text-anchor="middle" fill="#8a7a5a" font-size="3.5" font-style="italic">属于这里</text>
  <!-- 黑色指纹 -->
  <ellipse cx="18" cy="54" rx="5" ry="6" fill="#0a0505" opacity="0.7"/>
  <path d="M14 52 Q16 50 18 51 Q20 50 22 52" fill="none" stroke="#0a0505" stroke-width="0.5" opacity="0.5"/>
  <path d="M15 54 Q17 52 19 53 Q21 52 21 54" fill="none" stroke="#0a0505" stroke-width="0.4" opacity="0.5"/>
</svg>
