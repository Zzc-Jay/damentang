<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封印之间热区校准</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    color: #ccc;
    font-family: 'Segoe UI', 'PingFang SC', sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  .viewer {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    min-width: 0;
  }
  .viewer h2 { color: #c4a35a; margin-bottom: 6px; font-size: 18px; }
  .viewer .sub { color: #666; font-size: 12px; margin-bottom: 12px; }
  .scene {
    position: relative;
    width: 960px; max-width: 100%;
    aspect-ratio: 16/9;
    border: 2px solid #333;
    overflow: hidden;
    cursor: crosshair;
    border-radius: 4px;
    background: #000;
  }
  .scene img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }
  .hotspot {
    position: absolute;
    border: 2px dashed;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: bold;
    text-shadow: 0 0 4px #000, 0 0 8px #000;
    text-align: center;
    line-height: 1.2;
    flex-direction: column;
    transition: box-shadow 0.15s;
  }
  .hotspot.selected {
    outline: 3px solid #fff !important;
    z-index: 99 !important;
    box-shadow: 0 0 20px rgba(255,255,255,0.4) !important;
  }
  .crosshair {
    position: absolute;
    pointer-events: none;
    z-index: 100;
    color: #fff;
    font-size: 11px;
    text-shadow: 0 0 6px #000;
    display: none;
  }
  .panel {
    width: 320px;
    background: #1a1a1a;
    border-left: 1px solid #333;
    display: flex;
    flex-direction: column;
    padding: 20px;
    gap: 14px;
    overflow-y: auto;
  }
  .panel h3 { color: #c4a35a; font-size: 14px; margin-bottom: 4px; }
  .elem-list { display: flex; flex-direction: column; gap: 4px; }
  .elem-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 4px;
    cursor: pointer; border: 1px solid transparent;
    font-size: 12px; transition: all 0.15s;
  }
  .elem-row:hover { background: #222; }
  .elem-row.sel { border-color: #fff; background: #2a2a2a; }
  .elem-row .dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .coord-group { display: flex; flex-direction: column; gap: 6px; }
  .coord-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .coord-row label {
    color: #888; width: 16px; font-family: monospace; text-align: center;
  }
  .coord-row input {
    width: 70px; background: #222; border: 1px solid #444;
    color: #c4a35a; padding: 4px 6px; border-radius: 3px;
    font-family: monospace; font-size: 13px; text-align: center;
  }
  .coord-row input:focus { border-color: #c4a35a; outline: none; }
  .btn-row { display: flex; gap: 8px; }
  button {
    flex: 1; padding: 8px 0; border: 1px solid #555;
    background: #222; color: #ccc; border-radius: 4px;
    cursor: pointer; font-size: 13px; transition: all 0.15s;
  }
  button:hover { border-color: #c4a35a; color: #c4a35a; }
  button.save { background: #2a2010; border-color: #c4a35a; color: #c4a35a; font-weight: bold; }
  button.save:hover { background: #3a2a10; }
  button.save:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { font-size: 12px; color: #888; min-height: 18px; text-align: center; }
  .status.ok { color: #4a4; }
  .status.err { color: #a44; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; }
  .legend span { font-size: 11px; padding: 2px 6px; border-radius: 3px; border: 1px solid; }
  .hint { font-size: 11px; color: #555; line-height: 1.5; }
  .hint kbd {
    background: #333; color: #aaa; padding: 1px 5px;
    border-radius: 2px; font-size: 10px; border: 1px solid #555;
  }
</style>
</head>
<body>

<div class="viewer">
  <h2>封印之间热区校准</h2>
  <p class="sub">背景 1672×941 &nbsp;|&nbsp; 坐标系 1920×1080 &nbsp;|&nbsp; 点击右侧列表或按 <kbd>1</kbd>-<kbd>5</kbd> 选中</p>
  <div class="scene" id="scene">
    <img src="images/bg/bg_seal_chamber.png" alt="seal chamber background" id="bg">
    <div class="crosshair" id="crosshair"></div>
  </div>
</div>

<div class="panel">
  <h3>📐 热区列表</h3>
  <div class="elem-list" id="elem-list"></div>

  <h3 id="coord-title" style="color:#888;">坐标 (选中热区)</h3>
  <div class="coord-group">
    <div class="coord-row"><label>X</label><input type="number" id="inp-x" disabled></div>
    <div class="coord-row"><label>Y</label><input type="number" id="inp-y" disabled></div>
    <div class="coord-row"><label>W</label><input type="number" id="inp-w" disabled></div>
    <div class="coord-row"><label>H</label><input type="number" id="inp-h" disabled></div>
  </div>

  <div class="btn-row">
    <button id="btn-reset" disabled>⟲ 重置该热区</button>
    <button class="save" id="btn-save" disabled>💾 保存到 data.js</button>
  </div>
  <div class="status" id="status"></div>

  <div class="legend">
    <span style="border-color:#48f;color:#48f;">返回</span>
    <span style="border-color:#0ff;color:#0ff;">热点</span>
    <span style="border-color:#0f0;color:#0f0;">道具</span>
    <span style="border-color:#ff0;color:#ff0;">门/机关</span>
    <span style="border-color:#f0f;color:#f0f;">NPC</span>
    <span style="border-color:#888;color:#888;">装饰</span>
  </div>

  <div class="hint">
    <p><kbd>1</kbd>-<kbd>5</kbd> 选中热区</p>
    <p><kbd>←↑↓→</kbd> 移动 (步长2)</p>
    <p><kbd>Shift</kbd>+方向 步长10</p>
    <p><kbd>Ctrl</kbd>+方向 步长50</p>
    <p><kbd>W</kbd><kbd>S</kbd> 调高度</p>
    <p><kbd>A</kbd><kbd>D</kbd> 调宽度</p>
  </div>
</div>

<script>
// ============ Data ============
const bgW = 1920, bgH = 1080;
const typeColors = {
  return:      { border: '#48f', text: '#48f', bg: 'rgba(0,100,255,0.1)' },
  hotspot:     { border: '#0ff', text: '#0ff', bg: 'rgba(0,255,255,0.08)' },
  collectible: { border: '#0f0', text: '#0f0', bg: 'rgba(0,255,0,0.1)' },
  door:        { border: '#ff0', text: '#ff0', bg: 'rgba(255,255,0,0.1)' },
  npc:         { border: '#f0f', text: '#f0f', bg: 'rgba(255,0,255,0.08)' },
  decoration:  { border: '#888', text: '#888', bg: 'rgba(128,128,128,0.08)' },
};

const elements = [
  { id: 'return_seal_to_passage', type: 'return',  x: 60, y: 400, bgW: 120, bgH: 200 },
  { id: 'central_seal',    type: 'door',    x: 960, y: 454, bgW: 280, bgH: 280 },
  { id: 'four_pillars',    type: 'hotspot', x: 480, y: 594, bgW: 600, bgH: 250 },
  { id: 'ritual_altar',    type: 'hotspot', x: 1440, y: 594, bgW: 220, bgH: 160 },
  { id: 'npc_keepers',     type: 'npc',     x: 960, y: 173, bgW: 700, bgH: 300 },
];
const origCoords = elements.map(e => ({ ...e }));

// ============ DOM refs ============
const scene = document.getElementById('scene');
const bg = document.getElementById('bg');
const crosshair = document.getElementById('crosshair');
const elemList = document.getElementById('elem-list');
const coordTitle = document.getElementById('coord-title');
const inpX = document.getElementById('inp-x'), inpY = document.getElementById('inp-y');
const inpW = document.getElementById('inp-w'), inpH = document.getElementById('inp-h');
const btnReset = document.getElementById('btn-reset');
const btnSave = document.getElementById('btn-save');
const status = document.getElementById('status');

let selectedIdx = -1;
const hotspotDivs = [];

// ============ Build scene hotspots ============
elements.forEach((el, i) => {
  const div = document.createElement('div');
  div.className = 'hotspot';
  const tc = typeColors[el.type];
  div.style.borderColor = tc.border;
  div.style.color = tc.text;
  div.style.background = tc.bg;
  div.dataset.idx = i;
  div.innerHTML = '<b>' + el.id + '</b><small style="opacity:0.7">' + el.type + '</small>';
  applyPos(div, el);
  scene.appendChild(div);
  hotspotDivs.push(div);
});

function applyPos(div, el) {
  div.style.left   = (el.x / bgW * 100) + '%';
  div.style.top    = (el.y / bgH * 100) + '%';
  div.style.width  = (el.bgW / bgW * 100) + '%';
  div.style.height = (el.bgH / bgH * 100) + '%';
}

// ============ Sidebar list ============
elements.forEach((el, i) => {
  const row = document.createElement('div');
  row.className = 'elem-row';
  const tc = typeColors[el.type];
  row.innerHTML = '<span class="dot" style="background:' + tc.border + '"></span>' +
    '<span style="flex:1">' + el.id + '</span>' +
    '<span style="color:' + tc.border + ';font-size:10px">' + el.type + '</span>' +
    '<span style="color:#555;font-size:10px;font-family:monospace">' + (i + 1) + '</span>';
  row.addEventListener('click', () => selectElement(i));
  row.dataset.idx = i;
  elemList.appendChild(row);
});

function updateListSelection() {
  elemList.querySelectorAll('.elem-row').forEach((r, i) => {
    r.classList.toggle('sel', i === selectedIdx);
  });
}

// ============ Selection ============
function selectElement(idx) {
  hotspotDivs.forEach(d => d.classList.remove('selected'));
  selectedIdx = idx;
  if (idx >= 0) {
    hotspotDivs[idx].classList.add('selected');
    const el = elements[idx];
    inpX.value = el.x; inpY.value = el.y;
    inpW.value = el.bgW; inpH.value = el.bgH;
    inpX.disabled = false; inpY.disabled = false;
    inpW.disabled = false; inpH.disabled = false;
    btnReset.disabled = false;
    btnSave.disabled = false;
    coordTitle.textContent = '📐 坐标 — ' + el.id;
    coordTitle.style.color = typeColors[el.type].text;
  } else {
    inpX.value = ''; inpY.value = ''; inpW.value = ''; inpH.value = '';
    inpX.disabled = true; inpY.disabled = true;
    inpW.disabled = true; inpH.disabled = true;
    btnReset.disabled = true;
    btnSave.disabled = true;
    coordTitle.textContent = '坐标 (选中热区)';
    coordTitle.style.color = '#888';
  }
  updateListSelection();
}

// ============ Input sync ============
function syncInputsToElement() {
  if (selectedIdx < 0) return;
  const el = elements[selectedIdx];
  el.x = parseInt(inpX.value) || 0;
  el.y = parseInt(inpY.value) || 0;
  el.bgW = parseInt(inpW.value) || 60;
  el.bgH = parseInt(inpH.value) || 60;
  applyPos(hotspotDivs[selectedIdx], el);
}
[inpX, inpY, inpW, inpH].forEach(inp => {
  inp.addEventListener('input', syncInputsToElement);
});

// ============ Reset element ============
btnReset.addEventListener('click', () => {
  if (selectedIdx < 0) return;
  const orig = origCoords[selectedIdx];
  const el = elements[selectedIdx];
  el.x = orig.x; el.y = orig.y; el.bgW = orig.bgW; el.bgH = orig.bgH;
  applyPos(hotspotDivs[selectedIdx], el);
  inpX.value = el.x; inpY.value = el.y;
  inpW.value = el.bgW; inpH.value = el.bgH;
});

// ============ Save ============
btnSave.addEventListener('click', async () => {
  btnSave.disabled = true;
  btnSave.textContent = '保存中...';
  status.textContent = '';
  status.className = 'status';

  const data = elements.map(e => ({
    id: e.id, x: e.x, y: e.y, bgW: e.bgW, bgH: e.bgH
  }));

  try {
    const res = await fetch('/save-seal_chamber', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (result.ok) {
      status.textContent = '✓ ' + result.msg;
      status.className = 'status ok';
    } else {
      status.textContent = '✗ ' + result.msg;
      status.className = 'status err';
    }
  } catch (e) {
    const code = elements.map(e =>
      "  { id: '" + e.id + "', x: " + e.x + ", y: " + e.y + ", bgOverlay: { w: " + e.bgW + ", h: " + e.bgH + " } },"
    ).join('\n');
    await navigator.clipboard.writeText(code);
    status.textContent = '⚠ 服务器未连接，已复制坐标到剪贴板';
    status.className = 'status err';
  }
  btnSave.disabled = false;
  btnSave.textContent = '💾 保存到 data.js';
});

// ============ Keyboard ============
document.addEventListener('keydown', (e) => {
  // 1-5 select
  if (e.key >= '1' && e.key <= '5' && !e.ctrlKey && !e.metaKey) {
    const idx = parseInt(e.key) - 1;
    e.preventDefault();
    selectElement(idx);
    return;
  }
  if (selectedIdx < 0) return;
  const el = elements[selectedIdx];
  const step = e.shiftKey ? 10 : (e.ctrlKey ? 50 : 2);
  let moved = false;
  switch (e.key) {
    case 'ArrowLeft':  el.x -= step; moved = true; break;
    case 'ArrowRight': el.x += step; moved = true; break;
    case 'ArrowUp':    el.y -= step; moved = true; break;
    case 'ArrowDown':  el.y += step; moved = true; break;
    case 'w': case 'W': el.bgH = Math.max(10, el.bgH - step); moved = true; break;
    case 's': case 'S': el.bgH += step; moved = true; break;
    case 'a': case 'A': el.bgW = Math.max(10, el.bgW - step); moved = true; break;
    case 'd': case 'D': el.bgW += step; moved = true; break;
  }
  if (moved) {
    e.preventDefault();
    applyPos(hotspotDivs[selectedIdx], el);
    inpX.value = el.x; inpY.value = el.y;
    inpW.value = el.bgW; inpH.value = el.bgH;
  }
});

// ============ Mouse hover crosshair ============
bg.addEventListener('mousemove', (e) => {
  const rect = bg.getBoundingClientRect();
  const dataX = Math.round((e.clientX - rect.left) / rect.width * bgW);
  const dataY = Math.round((e.clientY - rect.top) / rect.height * bgH);
  crosshair.style.display = 'block';
  crosshair.style.left = (e.clientX - rect.left) + 'px';
  crosshair.style.top  = (e.clientY - rect.top + 16) + 'px';
  crosshair.textContent = dataX + ', ' + dataY;
});
bg.addEventListener('mouseleave', () => { crosshair.style.display = 'none'; });

// init
selectElement(-1);
</script>
</body>
</html>
