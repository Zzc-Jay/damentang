<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大门塘 — 暗黑点触式解谜游戏</title>
  <meta name="description" content="大门塘（Damentang）是一款受锈湖启发的暗黑风格点触式解谜游戏。探索被遗忘的南方水乡，收集道具、破解谜题、揭开大门塘隐藏的秘密。">
  <meta name="theme-color" content="#0a0a14">

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="大门塘">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="images/og-image.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.zengzhichao.com/damentang">
  <meta property="og:title" content="大门塘 — 暗黑点触式解谜游戏">
  <meta property="og:description" content="探索被遗忘的南方水乡，破解谜题，揭开大门塘隐藏的秘密。">
  <meta property="og:image" content="https://www.zengzhichao.com/damentang/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="大门塘">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="大门塘 — 暗黑点触式解谜游戏">
  <meta name="twitter:description" content="探索被遗忘的南方水乡，破解谜题，揭开大门塘隐藏的秘密。">
  <meta name="twitter:image" content="https://www.zengzhichao.com/damentang/images/og-image.png">

  <!-- 标题字体：display=optional 避免闪烁，缓存后即时渲染 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=optional">

  <!-- 预加载首场景关键音频 -->
  <link rel="preload" href="audio/amb_village.mp3" as="audio">
  <link rel="preload" href="audio/sfx_click.mp3" as="audio">
  <link rel="preload" href="audio/sfx_collect.mp3" as="audio">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 开场 / 结局画面 -->
  <div id="overlay-screen">
    <div id="overlay-content">
      <h1 id="overlay-title">大 门 塘</h1>
      <p id="overlay-text"></p>
      <button id="overlay-btn">点击继续</button>
      <button id="overlay-btn2" class="hidden">—</button>
    </div>
  </div>

  <!-- 游戏主体 -->
  <div id="game-container" class="hidden">
    <!-- 场景区域 -->
    <div id="scene-wrapper">
      <div id="scene-background"></div>
      <div id="scene-elements"></div>
      <div id="scene-title"></div>
      <div id="holding-indicator" class="hidden"></div>
      <button id="nav-left" class="nav-arrow" title="向左">◂</button>
      <button id="nav-right" class="nav-arrow" title="向右">▸</button>
      <button id="nav-down" class="nav-arrow nav-down" title="返回">▾</button>
      <button id="btn-hint" class="top-btn" title="提示">💡</button>
      <button id="btn-save" class="top-btn" title="存档" style="right:128px;">💾</button>
      <button id="btn-notes" class="top-btn" title="笔记" style="right:86px;">📓</button>
      <button id="btn-menu" class="top-btn" title="菜单">⚙️</button>
    </div>
    <!-- 对话框 -->
    <div id="dialog-box" class="hidden">
      <p id="dialog-text"></p>
      <div id="dialog-buttons">
        <button id="dialog-close">继续</button>
        <button id="dialog-choice-a" class="hidden choice-btn">—</button>
        <button id="dialog-choice-b" class="hidden choice-btn">—</button>
      </div>
    </div>
    <!-- 道具详情弹窗 -->
    <div id="item-detail" class="hidden">
      <div id="item-detail-content">
        <span id="item-detail-emoji"></span>
        <h3 id="item-detail-name"></h3>
        <p id="item-detail-desc"></p>
        <button id="item-detail-close">关闭</button>
      </div>
    </div>
    <!-- 背包栏 -->
    <div id="inventory-bar">
      <button id="inv-prev" class="inv-page-btn hidden" title="上一页">◂</button>
      <div id="inventory-slots"></div>
      <button id="inv-next" class="inv-page-btn hidden" title="下一页">▸</button>
      <span id="inv-page-indicator" class="hidden"></span>
    </div>
  </div>

  <script src="js/data.js?v=0.9.4"></script>
  <script src="js/audio.js?v=0.9.4"></script>
  <script src="js/storage.js?v=0.9.4"></script>
  <script src="js/puzzles.js?v=0.9.4"></script>
  <script src="js/engine.js?v=0.9.4"></script>
  <script src="js/main.js?v=0.9.4"></script>
</body>
</html>
